                if (chaosBtnText) chaosBtnText.innerText = "🚨 ULTIMATE OVERLOAD 10000% 🚨";
                
                // Hide Bouncing Avatar Images
                activeBouncingImages.forEach(img => img.el.style.display = 'none');

                clearInterval(popupInterval);
                clearInterval(emojiInterval);
                clearInterval(textCorruptInterval);
                
                document.querySelectorAll('.chaos-popup, .floating-emoji').forEach(p => p.remove());
                
                originalTextMap.forEach((origVal, node) => {
                    node.nodeValue = origVal;
                });
            }
        }

        // Matrix Rain Background
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンYEREPHACK1337STANDKNIFE💣⚡🔥';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 3, 8, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = chaosMode ? '#00ff00' : '#00f3ff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = katakana.charAt(Math.floor(Math.random() * katakana.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Interactive ESP Radar Simulator
        const espCanvas = document.getElementById('espCanvas');
        const espCtx = espCanvas.getContext('2d');
        let espMode = 'box';

        function resizeEspCanvas() {
            if(!espCanvas) return;
            espCanvas.width = espCanvas.parentElement.clientWidth;
            espCanvas.height = espCanvas.parentElement.clientHeight;
        }
        resizeEspCanvas();
        window.addEventListener('resize', resizeEspCanvas);

        let player = { x: 150, y: 150, angle: 0 };
        let targets = [
            { x: 80, y: 70, hp: 100, name: 'Enemy_Noob', dir: 1 },
            { x: 240, y: 100, hp: 75, name: 'Pro_Knife_666', dir: -1 },
            { x: 200, y: 220, hp: 40, name: 'StandKnife_GOD', dir: 1 }
        ];

        function toggleEspMode(mode) {
            espMode = mode;
            playBeep(900);
        }

        function drawEspRadar() {
            if(!espCtx) return;
            espCtx.clearRect(0, 0, espCanvas.width, espCanvas.height);

            // Grid background
            espCtx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
            espCtx.lineWidth = 1;
            for(let x = 0; x < espCanvas.width; x += 30) {
                espCtx.beginPath();
                espCtx.moveTo(x, 0);
                espCtx.lineTo(x, espCanvas.height);
                espCtx.stroke();
            }
            for(let y = 0; y < espCanvas.height; y += 30) {
                espCtx.beginPath();
                espCtx.moveTo(0, y);
                espCtx.lineTo(espCanvas.width, y);
                espCtx.stroke();
            }

            // Draw Local Player
            player.x = espCanvas.width / 2;
            player.y = espCanvas.height - 40;

            // FOV Cone
            espCtx.fillStyle = 'rgba(0, 243, 255, 0.15)';
            espCtx.beginPath();
            espCtx.moveTo(player.x, player.y);
            espCtx.arc(player.x, player.y, 220, -Math.PI * 0.75, -Math.PI * 0.25);
            espCtx.closePath();
            espCtx.fill();

            // Player Icon
            espCtx.fillStyle = '#00f3ff';
            espCtx.beginPath();
            espCtx.arc(player.x, player.y, 8, 0, Math.PI * 2);
            espCtx.fill();

            // Update & Draw Targets
            targets.forEach((t, idx) => {
                t.x += Math.sin(Date.now() * 0.002 + idx) * 1.5;
                t.y += Math.cos(Date.now() * 0.002 + idx) * 0.8;

                // Snaplines
                if(espMode === 'lines' || espMode === 'box') {
                    espCtx.strokeStyle = 'rgba(255, 0, 127, 0.7)';
                    espCtx.lineWidth = 1.5;
                    espCtx.beginPath();
                    espCtx.moveTo(player.x, player.y);
                    espCtx.lineTo(t.x, t.y);
                    espCtx.stroke();
                }

                // Target Box ESP / Chams
                if(espMode === 'chams') {
                    espCtx.fillStyle = 'rgba(255, 0, 255, 0.6)';
                    espCtx.beginPath();
                    espCtx.arc(t.x, t.y, 14, 0, Math.PI * 2);
                    espCtx.fill();
                } else {
                    espCtx.strokeStyle = '#ff007f';
                    espCtx.lineWidth = 2;
                    espCtx.strokeRect(t.x - 12, t.y - 18, 24, 36);

                    // Healthbar
                    espCtx.fillStyle = '#00ff66';
                    espCtx.fillRect(t.x - 16, t.y - 18 + (36 * (1 - t.hp/100)), 3, 36 * (t.hp/100));
                }

                // Name & Distance
                espCtx.fillStyle = '#fff';
                espCtx.font = '9px monospace';
                espCtx.fillText(`${t.name} [${Math.floor(t.hp)}HP]`, t.x - 20, t.y - 22);
            });

            requestAnimationFrame(drawEspRadar);
        }
        drawEspRadar();

        // Case Opener Roulette
        const caseSkins = [
            { name: "M9 BAYONET | DRAGON GLASS", color: "#ff007f", rare: "ARCANA" },
            { name: "KARAMBIT | GOLD LEGEND", color: "#ffee00", rare: "SECRET" },
            { name: "BUTTERFLY | YEREPHACK", color: "#00f3ff", rare: "LIMITED" },
            { name: "STILETTO | TOXIC VENOM", color: "#00ff66", rare: "RARE" },
            { name: "JUNGLE KNIFE | CYBERPUNK", color: "#b000ff", rare: "EPIC" }
        ];

        function initCaseReel() {
            const reel = document.getElementById('caseReel');
            if(!reel) return;
            reel.innerHTML = '';
            for(let i = 0; i < 35; i++) {
                const item = caseSkins[Math.floor(Math.random() * caseSkins.length)];
                const div = document.createElement('div');
                div.className = 'w-32 h-28 rounded-lg flex-shrink-0 bg-black/80 border p-2 flex flex-col justify-between items-center text-center';
                div.style.borderColor = item.color;
                div.innerHTML = `
                    <div class="text-xs font-mono font-bold" style="color:${item.color}">${item.rare}</div>
                    <div class="text-3xl">🔪</div>
                    <div class="text-[10px] font-orbitron font-bold text-white leading-tight">${item.name}</div>
                `;
                reel.appendChild(div);
            }
        }
        initCaseReel();

        function spinCase() {
            playBeep(1200);
            const reel = document.getElementById('caseReel');
            const winResult = document.getElementById('winResult');
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            winResult.innerText = "КРУТИМ КЕЙС...";

            const targetItem = caseSkins[Math.floor(Math.random() * caseSkins.length)];
            const offset = -(15 * 144) + (Math.random() * 40 - 20);
            reel.style.transform = `translateX(${offset}px)`;

            setTimeout(() => {
                winResult.innerHTML = `🎉 ВЫ ВЫБИЛИ: <span style="color:${targetItem.color}">${targetItem.name}</span>!`;
                btn.disabled = false;
                if(typeof confetti === 'function') confetti();
                playBeep(1500);
            }, 5000);
        }

        // Platform & Injection Logic
        function selectPlatform(btn, name) {
            document.querySelectorAll('.plat-btn').forEach(b => {
                b.className = 'plat-btn p-2 rounded bg-gray-800 border border-gray-600 text-xs font-bold text-center';
            });
            btn.className = 'plat-btn active p-2 rounded bg-pink-600 border border-pink-300 text-xs font-bold text-center';
            playBeep();
        }

        function startInjection() {
            const bar = document.getElementById('injectBar');
            const btn = document.getElementById('injectBtn');
            const consoleBox = document.getElementById('consoleBox');
            
            btn.disabled = true;
            let progress = 0;

            const logs = [
                "[INJECT] Connecting to StandKnife process...",
                "[BYPASS] Disabling Anti-Cheat Memory Scanner...",
                "[HOOK] Hooking DirectX 11 / OpenGL Overlay...",
                "[PATCH] Unlocking All Knives & Gold Generator...",
                "[SUCCESS] YEREPHACK v4.2 SUCCESSFULLY INJECTED!"
            ];
            let logIdx = 0;

            const timer = setInterval(() => {
                progress += 5;
                bar.style.width = progress + '%';
                playBeep(400 + progress * 8);

                if(progress % 20 === 0 && logIdx < logs.length) {
                    const div = document.createElement('div');
                    div.className = logIdx === logs.length - 1 ? 'text-yellow-400 font-bold' : 'text-cyan-300';
                    div.innerText = logs[logIdx];
                    consoleBox.appendChild(div);
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    logIdx++;
                }

                if(progress >= 100) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-circle-check text-green-400"></i> ИНЖЕКТ ЗАВЕРШЕН!';
                    if(typeof confetti === 'function') confetti();
                }
            }, 100);
        }

        // Key Generator
        function generateKey() {
            playBeep(1400);
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = 'YERE-';
            for(let i=0; i<4; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
            key += '-';
            for(let i=0; i<4; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
            key += '-2026';
            document.getElementById('keyOutput').value = key;

        }

        function generateShefKey() {

            const chars = '0123456789ABCDEF';

        function copyShefKey() {

    </script>
